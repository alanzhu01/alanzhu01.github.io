<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chi-Square Test</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
</head>
<body>
  <header class="header">
    <a href="/" class="home">
      <img src="./assets/ucsb-logo-light.png" alt="UCSB" class="ucsb-logo logo-light">
      <h1 class="header-text">PSTAT 120 Applets</h1>
    </a>
  </header>

  <main class="distribution-content">
    <div class="distribution-shell">
      <div class="hypothesis-tabs">
        <button class="hypothesis-tab active" data-mode="independence">
          Independence
        </button>

        <button class="hypothesis-tab" data-mode="homogeneity">
          Homogeneity
        </button>

        <button class="hypothesis-tab" data-mode="gof">
          Goodness of Fit
        </button>
      </div>

      <div class="distribution-container">
        <div class="distribution-name">
          <h1>Chi-Square Test</h1>
          <label class="segmented-toggle">
            <input type="checkbox" id="formula-toggle" class="segmented-input">

            <span class="segmented-track">
              <span class="segmented-option left">Value</span>
              <span class="segmented-option right"> Formula</span>
              <span class="segmented-thumb"></span>
            </span>
          </label>
        </div>

        <div class="distribution-app">
          <div class="split-layout">
            <div class="left-panel">
              <div class="hypothesis-inputs">
                <div class="distribution-input-grid-2col-1row">
                  <div class="distribution-input hypothesis-box">
                    <label>\(H_0: \text{The variables are independent} \)</label>

                    <label>\(H_1: \text{The variables are not independent} \)</label>
                  </div>

                  <div class="distribution-input alpha-controls">
                    <div class="alpha-row">
                      <label for="a">\(\alpha =\)</label>

                      <div class="has-tip">
                        <input type="text" id="a" maxlength="8">
                        <div class="tip" role="tooltip">Significance level</div>
                      </div>
                    </div>

                    <div class="raw-data-actions">
                      <button type="button" id="raw-data-btn" class="pill">
                        Enter Raw Data
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="distribution-output">
            <div id="plot"></div>

            <div id="stats-col" class="stats-col hidden">
              <aside class="stats">
                <div class="stats-row">
                  <span class="stats-label" id="label-stat">Test Statistic</span>
                  <span id="z-stat" class="stats-value">—</span>
                </div>

                <div class="stats-row">
                  <span class="stats-label" id="label-p">P-Value</span>
                  <span id="p-value" class="stats-value">—</span>
                </div>

                <div class="stats-row">
                  <span class="stats-label" id="label-crit">Critical Value</span>
                  <span id="crit-value" class="stats-value">—</span>
                </div>
              </aside>

              <aside class="decision masked" id="decision-box">
                <div class="functions-row">
                  <div class="stats-label">Decision</div>
                  <div id="decision" class="stats-function">\( \text{—} \)</div>
                </div>

                <div class="functions-row">
                  <div class="stats-label" id="label-crit-rule">Critical Value Rule</div>
                  <div id="crit-rule" class="stats-function">\( \text{—} \)</div>
                </div>

                <div class="functions-row">
                  <div class="stats-label" id="label-p-rule">P-Value Rule</div>
                  <div id="p-rule" class="stats-function">\( \text{—} \)</div>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="raw-data-modal" class="raw-data-modal hidden" aria-hidden="true">
      <div class="raw-data-modal-card raw-data-grid-card">
        <div class="raw-data-modal-header">
          <h3>Enter Raw Data</h3>

          <div class="raw-data-size-controls">
            <label>
              Rows
              <input type="number" id="raw-data-rows" min="1" max="8" value="3">
            </label>

            <span>×</span>

            <label>
              Columns
              <input type="number" id="raw-data-cols" min="1" max="8" value="3">
            </label>
          </div>
        </div>

        <div id="raw-data-grid" class="raw-data-grid"></div>

        <div id="raw-data-error" class="raw-data-error"></div>

        <div class="raw-data-modal-actions">
          <button type="button" id="raw-data-cancel" class="pill">Cancel</button>
          <button type="button" id="raw-data-submit" class="pill">Enter</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="./js/pages/chi-square-test.js"></script>
</body>
</html>

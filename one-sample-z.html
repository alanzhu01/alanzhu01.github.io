<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>One Sample Z Test</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
</head>
<body>
  <header class="header">
    <a href="/" class="home">
      <img src="./assets/ucsb-logo-light.png" alt="UCSB" class="ucsb-logo logo-light">
      <h1 class="header-text">PSTAT 120 Applets</h1>
    </a>
  </header>

  <main class="distribution-content">
    <div class="distribution-shell">
      <div class="hypothesis-tabs">
        <button class="hypothesis-tab active" data-mode="composite">
          Composite Hypothesis
        </button>

        <button class="hypothesis-tab" data-mode="simple">
          Simple Hypothesis
        </button>
      </div>

      <div class="distribution-container">
        <div class="distribution-name">
          <h1>One Sample Z Test</h1>
          <label class="segmented-toggle">
            <input type="checkbox" id="formula-toggle" class="segmented-input">

            <span class="segmented-track">
              <span class="segmented-option left">Value</span>
              <span class="segmented-option right"> Formula</span>
              <span class="segmented-thumb"></span>
            </span>
          </label>
        </div>

        <div class="distribution-app">
          <div class="split-layout">
            <div class="left-panel">
              <div class="hypothesis-inputs">
                <div class="distribution-input-grid-2col-col">
                  <div class="distribution-input">
                    <label>\(H_0: \mu = \)</label>
                    <input type="text" id="mu0" maxlength="8">
                  </div>

                  <div class="distribution-input">
                    <label>\(H_1: \mu \)</label>

                    <select class="pill" id="h1-type">
                      <option value="lt">&lt;</option>
                      <option value="neq" selected>≠</option>
                      <option value="gt">&gt;</option>
                    </select>

                    <span id="h1-equals" class="hidden equals-text">\(=\)</span>

                    <input type="text" id="h1" maxlength="8">
                  </div>

                  <div class="distribution-input">
                    <label for="a">\(\alpha =\)</label>

                    <div class="has-tip">
                      <input type="text" id="a" maxlength="8">
                      <div class="tip" role="tooltip">Significance level</div>
                    </div>
                  </div>

                  <div class="raw-data-actions">
                    <button type="button" id="raw-data-btn" class="pill">Enter Data</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="right-panel">
              <div class="distribution-input-grid-2col">
                <div class="distribution-input">
                  <label for="x">\(\bar{x} =\)</label>
                  
                  <div class="has-tip">
                    <input type="text" id="xbar" maxlength="8">
                    <div class="tip" role="tooltip">Sample mean</div>
                  </div>
                </div>

                <div class="distribution-input">
                  <label for="s">\(\sigma =\)</label>

                  <div class="has-tip">
                    <input type="text" id="s" maxlength="8">
                    <div class="tip" role="tooltip">Standard deviation</div>
                  </div>
                </div>
        
                <div class="distribution-input">
                  <label for="n">\(n =\)</label>

                  <div class="has-tip">
                    <input type="text" id="n" maxlength="8">
                    <div class="tip" role="tooltip">Sample size</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="distribution-output">
            <div id="plot"></div>

            <div id="stats-col" class="stats-col hidden">
              <aside class="stats">
                <div class="stats-row">
                  <span class="stats-label" id="label-stat">Test Statistic</span>
                  <span id="z-stat" class="stats-value">—</span>
                </div>

                <div class="stats-row">
                  <span class="stats-label" id="label-p">P-Value</span>
                  <span id="p-value" class="stats-value">—</span>
                </div>

                <div class="stats-row">
                  <span class="stats-label" id="label-crit">Critical Value</span>
                  <span id="crit-value" class="stats-value">—</span>
                </div>
              </aside>

              <aside class="decision masked" id="decision-box">
                <div class="functions-row">
                  <div class="stats-label">Decision</div>
                  <div id="decision" class="stats-function">\( \text{—} \)</div>
                </div>

                <div class="functions-row">
                  <div class="stats-label" id="label-crit-rule">Critical Value Rule</div>
                  <div id="crit-rule" class="stats-function">\( \text{—} \)</div>
                </div>

                <div class="functions-row">
                  <div class="stats-label" id="label-p-rule">P-Value Rule</div>
                  <div id="p-rule" class="stats-function">\( \text{—} \)</div>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="raw-data-modal" class="raw-data-modal hidden" aria-hidden="true">
      <div class="raw-data-modal-card">
        <h3>Enter numbers separated by commas</h3>

        <textarea
          id="raw-data-input"
          rows="2"
        ></textarea>

        <div id="raw-data-error" class="raw-data-error"></div>

        <div class="raw-data-modal-actions">
          <button type="button" id="raw-data-cancel" class="pill">Cancel</button>
          <button type="button" id="raw-data-submit" class="pill">Enter</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="./js/pages/one-sample-z.js"></script>
</body>
</html>
